<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Give an IN</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet"><style>body{margin:0;background:#070707;color:#f3eee8;font-family:'DM Sans',sans-serif}.wrap{max-width:760px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between}.logo{font:italic 500 48px 'Playfair Display'}.back{color:#9d8d84;text-decoration:none;font-size:9px;letter-spacing:.14em;text-transform:uppercase;border:1px solid #312a26;border-radius:22px;padding:10px 13px}.back:hover{color:#f3eee8;border-color:#67564f}.ey{font-size:9px;letter-spacing:.19em;text-transform:uppercase;color:#a18279;margin-top:50px}h1{font:500 clamp(60px,10vw,110px)/.88 'Playfair Display';letter-spacing:-.055em;margin:10px 0 20px}.lead{color:#b9aea7;line-height:1.6;max-width:620px}.panel{margin-top:36px;border:1px solid #332a26;padding:28px;background:#0b0909}.field{margin:16px 0}.field label{display:block;font-size:9px;letter-spacing:.13em;color:#8c7d75;margin-bottom:8px}.field input{width:100%;box-sizing:border-box;padding:14px;background:#090808;border:1px solid #453934;color:#f3eee8;font-size:14px}.btn{border:1px solid #efe3d8;background:#efe3d8;color:#160e0b;border-radius:28px;padding:12px 18px;font:600 9px 'DM Sans';letter-spacing:.09em;cursor:pointer}.btn.ghost{background:transparent;color:#d8ccc4;border-color:#4b3f3a;text-decoration:none;display:inline-block}.result{display:none;margin-top:25px;border-top:1px solid #2f2825;padding-top:24px}.result.show{display:block}.url{word-break:break-all;color:#d7c7bd;font-size:12px;line-height:1.5;background:#0a0808;border:1px solid #302824;padding:14px;margin:12px 0}.small{font-size:10px;color:#756963;line-height:1.5;margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}</style></head><body><main class="wrap"><div class="top"><div class="logo">IN</div><a class="back" href="/mikey.html">← BACK TO MY IN</a></div><div class="ey">GIVE SOMEONE AN IN</div><h1>Who are you bringing in?</h1><div class="lead">Create a private invitation. When they open it and join, IN will know who brought them into the network.</div><div class="panel"><div class="field"><label>THEIR NAME</label><input id="name" placeholder="First name"></div><div class="field"><label>PHONE OR EMAIL · OPTIONAL</label><input id="contact" placeholder="So you know who this invite is for"></div><button class="btn" onclick="createInvite()">CREATE THEIR IN →</button><div class="result" id="result"><div class="ey">THEIR PRIVATE IN</div><div class="url" id="url"></div><div class="actions"><button class="btn" onclick="copyLink()">COPY INVITE LINK</button><a class="btn ghost" href="/mikey.html">BACK TO MY IN →</a></div><div class="small" id="status"></div></div></div></main><script>const API='https://in-nyc-api.onrender.com';const p=new URLSearchParams(location.search);const FROM=(p.get('from')||'mikey').toLowerCase();async function createInvite(){const name=document.getElementById('name').value.trim(),contact=document.getElementById('contact').value.trim();if(!name)return;const r=await fetch(API+'/api/network/invite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:FROM,name,contact})});const d=await r.json();if(!d.ok){alert(d.error||'Could not create invite');return}document.getElementById('url').textContent=d.invite.url;document.getElementById('result').classList.add('show');document.getElementById('status').textContent='Created by '+FROM+'. Status: sent.'}function copyLink(){navigator.clipboard.writeText(document.getElementById('url').textContent);document.getElementById('status').textContent='Copied. Send this private link directly.'}</script></body></html>
