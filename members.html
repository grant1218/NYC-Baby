<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IN / Network</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet"><style>body{margin:0;background:#070707;color:#f3eee8;font-family:'DM Sans',sans-serif}.wrap{max-width:1080px;margin:auto;padding:28px}.logo{font:italic 500 48px 'Playfair Display'}.ey{font-size:9px;letter-spacing:.19em;text-transform:uppercase;color:#a18279}h1{font:500 clamp(60px,9vw,100px)/.88 'Playfair Display';letter-spacing:-.055em;margin:50px 0 15px}.lead{color:#9f9189}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:35px 0}.stat{border:1px solid #332b27;padding:22px}.stat b{font:500 44px 'Playfair Display';display:block}.section{border-top:1px solid #2d2724;padding:35px 0}.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:15px;padding:16px 0;border-bottom:1px solid #25201e;align-items:center}.name{font:500 25px 'Playfair Display'}.muted{font-size:10px;color:#786c66}.pill{font-size:9px;letter-spacing:.1em;text-transform:uppercase}.sent{color:#b7a59b}.opened{color:#d7c89e}.joined{color:#b9d7a5}.btn{display:inline-block;border:1px solid #efe3d8;background:#efe3d8;color:#160e0b;border-radius:28px;padding:11px 16px;font-size:9px;letter-spacing:.09em;text-decoration:none}@media(max-width:700px){.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row>*:nth-child(3),.row>*:nth-child(4){font-size:9px}}</style></head><body><main class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><div class="logo">IN</div><a class="btn" href="give-in.html?from=mikey">GIVE AN IN</a></div><h1>The network.</h1><div class="lead">Who was invited. Who opened it. Who actually joined.</div><div class="stats"><div class="stat"><span class="ey">JOINED</span><b id="joined">0</b></div><div class="stat"><span class="ey">INVITES</span><b id="invites">0</b></div><div class="stat"><span class="ey">OPENED</span><b id="opened">0</b></div></div><section class="section"><div class="ey">MEMBERS WHO JOINED</div><div id="members"></div></section><section class="section"><div class="ey">INVITATION PIPELINE</div><div id="pipeline"></div></section></main><script>const API='https://in-nyc-api.onrender.com';function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function when(x){return x?new Date(x).toLocaleString():'—'}async function load(){const r=await fetch(API+'/api/network/members',{cache:'no-store'}),d=await r.json();document.getElementById('joined').textContent=d.count;document.getElementById('invites').textContent=d.invites.length;document.getElementById('opened').textContent=d.invites.filter(x=>x.openedAt).length;document.getElementById('members').innerHTML=d.members.length?d.members.map(m=>`<div class="row"><div><div class="name">${esc(m.name)}</div><div class="muted">${esc(m.contact||'No contact')}</div></div><div class="muted">Brought in by ${esc(m.invitedBy)}</div><div class="muted">${esc((m.interests||[]).join(' · '))}</div><div class="muted">${when(m.joinedAt)}</div></div>`).join(''):'<div class="muted" style="padding:20px 0">No new members yet.</div>';document.getElementById('pipeline').innerHTML=d.invites.length?d.invites.map(i=>`<div class="row"><div><div class="name">${esc(i.name)}</div><div class="muted">from ${esc(i.from)}</div></div><div class="pill ${esc(i.status)}">${esc(i.status)}</div><div class="muted">Sent ${when(i.createdAt)}</div><div class="muted">${i.joinedAt?'Joined '+when(i.joinedAt):i.openedAt?'Opened '+when(i.openedAt):'Not opened yet'}</div></div>`).join(''):'<div class="muted" style="padding:20px 0">No invites yet.</div>'}load();setInterval(load,5000);</script></body></html>
