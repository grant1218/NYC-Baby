<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IN — Request Access</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#f4f1ed}body{font-family:'DM Sans',sans-serif}.page{min-height:100vh;display:grid;place-items:center;padding:28px;position:relative;overflow:hidden}.page:before{content:"";position:absolute;width:620px;height:620px;border-radius:50%;background:rgba(255,255,255,.018);filter:blur(70px);top:-260px;left:50%;transform:translateX(-50%)}.city{position:absolute;top:28px;right:32px;font-size:8px;letter-spacing:.3em;color:#45413f}.center{width:min(430px,100%);text-align:center;position:relative;z-index:1}.logo{font:italic 500 clamp(92px,18vw,150px)/.8 'Playfair Display';letter-spacing:-.09em;margin-bottom:48px}.rule{height:1px;background:#211f1e;width:54px;margin:0 auto 30px}.ey{font-size:8px;letter-spacing:.28em;color:#716b67;text-transform:uppercase;margin-bottom:13px}h1{font:500 31px/1.08 'Playfair Display';letter-spacing:-.025em;margin:0 0 35px}.form{text-align:left}.field{border-bottom:1px solid #2a2725;padding:15px 0}.field label{display:block;font-size:7px;letter-spacing:.2em;color:#625d59;margin-bottom:8px}.field input{width:100%;border:0;outline:0;background:transparent;color:#eee9e5;padding:0;font:400 14px 'DM Sans'}.field input::placeholder{color:#383533}.btn{width:100%;margin-top:32px;padding:14px;border:1px solid #e8e2dd;background:#e8e2dd;color:#080707;border-radius:2px;font:500 8px 'DM Sans';letter-spacing:.22em;cursor:pointer}.note{margin-top:17px;color:#403c39;font-size:8px;line-height:1.6;text-align:center}.invited{height:16px;margin-bottom:18px;font-size:8px;letter-spacing:.13em;color:#59534f;text-transform:uppercase}.done{display:none}.done.show{display:block}.request.hidden{display:none}.done h1{font-size:38px;margin-bottom:14px}.done p{color:#625c58;font-size:11px;line-height:1.6}.error{font-size:9px;color:#8b7168;margin-top:15px;min-height:14px}@media(max-width:500px){.page{padding:22px}.city{top:22px;right:22px}.logo{margin-bottom:42px}}</style></head><body><main class="page"><div class="city" id="city">IN</div><div class="center"><div class="logo">IN</div><section class="request" id="request"><div class="rule"></div><div class="ey">PRIVATE MEMBERSHIP</div><h1>Request access.</h1><div class="invited" id="invited"></div><div class="form"><div class="field"><label>NAME</label><input id="name" autocomplete="name"></div><div class="field"><label>EMAIL OR PHONE</label><input id="contact" autocomplete="email"></div><button class="btn" onclick="requestAccess()">REQUEST ACCESS</button><div class="error" id="error"></div><div class="note">Membership is by invitation or approval.</div></div></section><section class="done" id="done"><div class="rule"></div><div class="ey">IN</div><h1>Request received.</h1><p id="doneCopy">We'll take it from here.</p></section></div></main><script>const API='https://in-nyc-api.onrender.com',q=new URLSearchParams(location.search),token=q.get('token'),city=(q.get('city')||'').trim();let invite=null;if(city)document.getElementById('city').textContent='IN / '+city.toUpperCase();async function load(){if(!token)return;try{const r=await fetch(API+'/api/network/invite/'+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)return;invite=d.invite;document.getElementById('name').value=invite.name||'';if(invite.from){const n=invite.from.charAt(0).toUpperCase()+invite.from.slice(1);document.getElementById('invited').textContent='INVITED BY '+n}}catch(e){}}async function requestAccess(){const name=document.getElementById('name').value.trim(),contact=document.getElementById('contact').value.trim(),err=document.getElementById('error');err.textContent='';if(!name||!contact){err.textContent='Name and contact are required.';return}if(!token){err.textContent='A private invitation link is required.';return}try{const r=await fetch(API+'/api/network/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,name,contact,interests:[],openToMeet:false,gender:'',interestedIn:''})}),d=await r.json();if(!r.ok){err.textContent=d.error||'Could not submit request.';return}document.getElementById('request').classList.add('hidden');document.getElementById('done').classList.add('show');document.getElementById('doneCopy').textContent='Welcome, '+d.member.name+'. You’re IN.'}catch(e){err.textContent='Could not submit request. Try again.'}}load();</script></body></html>
