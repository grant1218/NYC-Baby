<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IN / Mikey Activity</title><style>body{margin:0;background:#0b0a09;color:#f4efe7;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:42px 24px}h1{font-family:Georgia,serif;font-size:52px;font-weight:400;margin:8px 0}.sub{color:#8f8981;margin-bottom:36px}.item{border-top:1px solid #2b2824;padding:20px 0;display:grid;grid-template-columns:1fr auto;gap:20px}.item b{display:block;font-family:Georgia,serif;font-size:24px;font-weight:400;margin-bottom:6px}.value{color:#d5b982}.time{color:#666;font-size:12px}.empty{border:1px solid #2b2824;padding:30px;color:#888}.tag{font-size:10px;letter-spacing:.15em;color:#c8ab7d;text-transform:uppercase}button{background:none;border:1px solid #4a443c;color:#ddd;padding:10px 14px;border-radius:24px;cursor:pointer}</style></head><body><main class="wrap"><div class="tag">Private prototype · Grant view</div><h1>What is Mikey up to?</h1><div class="sub">Every real tap Mikey makes in his IN appears here while the prototype server retains it.</div><div id="feed" class="empty">Waiting for Mikey…</div><p><button onclick="load()">REFRESH</button></p></main><script>const API='https://in-nyc-api.onrender.com';function nice(x){return x.replaceAll('-',' ').replace(/\b\w/g,c=>c.toUpperCase())}async function load(){const box=document.getElementById('feed');try{const r=await fetch(API+'/api/state?member=grant');const d=await r.json();const rows=(d.signals||[]).filter(s=>s.member==='mikey').reverse();if(!rows.length){box.className='empty';box.innerHTML='Waiting for Mikey…';return}box.className='';box.innerHTML=rows.map(s=>`<div class="item"><div><b>${nice(s.item)}</b><span class="value">${s.value}</span></div><div class="time">${new Date(s.createdAt).toLocaleString()}</div></div>`).join('')}catch(e){box.className='empty';box.innerHTML='IN API is waking up. Refresh in a moment.'}}load();setInterval(load,10000)</script></body></html>
